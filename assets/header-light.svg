<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Rhussel Combo — Java and Spring Boot</title>
  <desc id="desc">Backend systems and cloud delivery. An illustrative request path from a Spring Boot service in Docker on AWS EC2 to MySQL on Amazon RDS.</desc>
